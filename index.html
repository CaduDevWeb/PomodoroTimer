<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="icon" href="./Images/favicon.svg">
</head>
<body>
    <main id="Container">
        <h1 id="Titulo">Pomodoro Timer</h1>
        <div id="Timer">
            <div id="Timer__totime">25:00</div>
        </div>
        <div class="organizador-btn">
            <button id="organizador-btn__iniciar-btn" class="btn"><i class="bi bi-play-circle"></i></button>
            <button id="organizador-btn__pausa-btn" class="btn"><i class="bi bi-pause-circle"></i></button>
            <button id="organizador-btn__reiniciar-btn"class="btn"><i class="bi bi-arrow-counterclockwise"></i></button>
        </div>
        <script src="./script.js"></script>
    </main>
</body>
</html>
